<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog de Seguridad - Miguel Ángel Corredor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="background-grid"></div>

    <header>
        <div class="container">
            <a href="index.html" class="logo">&lt;Miguel Ángel Corredor&gt;</a>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="index.html#sobre-mi">Sobre Mí</a>
                <a href="index.html#proyectos">Proyectos</a>
                <a href="blog.html" class="active">Blog</a>
                <a href="index.html#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="blog" class="full-page-section">
            <div class="container">
                <div class="blog-header">
                    <h1>&gt; /var/log/security_blog</h1>
                    <p>Anotaciones, tutoriales y análisis sobre seguridad de sistemas.</p>
                </div>
                
                <div class="blog-filters">
                    <div class="filter-group-full">
                        <label for="filter-search"><i class="fa-solid fa-search"></i> Buscar:</label>
                        <input type="search" id="filter-search" placeholder="Ej: ELK, Malware, Docker...">
                    </div>
                    <div class="filter-group">
                        <label>Categoría:</label>
                        <select id="filter-category"><option value="all">Todas</option></select>
                    </div>
                    <div class="filter-group">
                        <label>Dificultad:</label>
                        <select id="filter-difficulty">
                            <option value="all">Todas</option>
                            <option value="facil">Fácil</option>
                            <option value="media">Media</option>
                            <option value="dificil">Difícil</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Etiquetas:</label>
                        <select id="filter-tags"><option value="all">Todas</option></select>
                    </div>
                </div>

                <div id="blog-posts-container" class="blog-posts-container">
                    </div>
                
                <button id="btn-ver-mas" class="btn" style="display: none; margin: 3rem auto;">
                    Cargar más registros [+]
                </button>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Miguel Ángel Corredor Ferrer. Security Blog.</p>
        </div>
    </footer>

    <script src="blog-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
